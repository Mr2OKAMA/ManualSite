<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Manual Portal</h1>

    <section class="panel">
      <label for="searchInput">検索</label>
      <input id="searchInput" type="text" placeholder="タイトル・カテゴリ・説明で検索" />
    </section>

    <section class="panel">
      <h2 id="formTitle">manual 新規追加</h2>
      <form id="manualForm">
        <input id="manualId" type="hidden" />
        <div class="field">
          <label for="titleInput">タイトル</label>
          <input id="titleInput" type="text" required />
        </div>
        <div class="field">
          <label for="categoryInput">カテゴリ</label>
          <input id="categoryInput" type="text" required />
        </div>
        <div class="field">
          <label for="descriptionInput">説明</label>
          <textarea id="descriptionInput" rows="3" required></textarea>
        </div>
        <div class="field">
          <label for="urlInput">SharePoint URL</label>
          <input id="urlInput" type="url" required />
        </div>
        <div class="actions">
          <button type="submit" id="saveButton">追加</button>
          <button type="button" id="cancelEditButton" class="secondary">編集をキャンセル</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>manual 一覧</h2>
      <ul id="manualList" class="manual-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
